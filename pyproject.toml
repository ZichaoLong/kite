[project]
name = "kite"
dynamic = ["version"]
description = "Bridge Feishu chats to kimi-code via kap-server."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0",
  "lark-oapi>=1.4.23",
  "websockets>=15.0",
]

[project.scripts]
kited = "kite.kited:main"
kitectl = "kite.kitectl:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["kite*"]

[tool.setuptools.package-data]
# Install-time templates ship inside the package so installed deployments
# scaffold instances without the source tree (kite/install_templates.py).
"kite.install_template_data" = ["*.example"]

[tool.setuptools.dynamic]
version = {attr = "kite.version.__version__"}

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
